function launchVideoCall() {
  const videoWindow = window.open('', '_blank');
  
  if (!videoWindow) {
    alert('Please allow popups to launch the video call.');
    return;
  }

  // Inject standard HTML/React page into the top-level window
  videoWindow.document.write("<!DOCTYPE html><html><head><title>Video Call & Auto-Recorder</title><script src='https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js'></script></head><body><div id='status'>Connecting...</div><video id='localVideo' autoplay playsinline muted style='width:300px;'></video><video id='remoteVideo' autoplay playsinline style='width:300px;'></video><script>let mediaRecorder;let recordedChunks = [];async function init() {try {const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true }); document.getElementById('localVideo').srcObject = stream; startRecording(stream);const peer = new Peer();peer.on('open', (id) => {document.getElementById('status').innerText = 'Room ID: ' + id;});peer.on('call', (call) => {call.answer(stream);call.on('stream', (remoteStream) => {document.getElementById('remoteVideo').srcObject = remoteStream; });});} catch (err) {console.error('Camera Access Failed:', err);}}function startRecording(stream) {recordedChunks = [];mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm' });mediaRecorder.ondataavailable = (e) => {if (e.data.size > 0) recordedChunks.push(e.data);};mediaRecorder.start(1000); }init();</script></body></html>");
  videoWindow.document.close();
}
